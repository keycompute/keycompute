[package]
name = "keycompute-routing"
version = "0.1.0"
edition = "2024"

[dependencies]
keycompute-config = { workspace = true }
futures = "0.3"
keycompute-types = { workspace = true }
keycompute-runtime = { workspace = true }
keycompute-db = { workspace = true }
llm-protocol-provider = { workspace = true }
async-trait = "0.1"
chrono = "0.4"
dashmap = "6"
rust_decimal = "1.40"
sea-orm = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"
