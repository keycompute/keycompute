[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
client-api = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = { version = "0.3", features = ["futures"] }
# Web 只使用 UTC 时间；关闭默认的 local-time `clock` 功能，避免引入
# Android/Windows/Apple 时区实现。`wasmbind` 为 wasm32 提供 JS Date。
chrono = { version = "0.4", default-features = false, features = ["std", "now", "wasmbind"] }
rust_decimal = "1.35"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "DomTokenList", "Storage", "Navigator", "Clipboard", "UrlSearchParams"] }

[features]
default = ["web"]
web = ["dioxus/web"]
